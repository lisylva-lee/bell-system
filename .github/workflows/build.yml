name: Build BellSystem EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.8.10 (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame==2.5.2 pystray pillow pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=bell.ico --name=BellSystem --hidden-import=pygame --hidden-import=pystray --hidden-import=PIL bell_system.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BellSystem-${{ matrix.arch }}.exe
          path: dist/BellSystem.exe